name = "macrolens-worker"
main = "worker.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding    = "MMF_KV"
id         = "66c313c710a04a4eb04775b80a44f313"
preview_id = "66c313c710a04a4eb04775b80a44f313"

[triggers]
# ★ worker.js의 CRON 상수와 반드시 동일하게 유지
# Cloudflare 무료 플랜은 '계정 전체' cron 5개 한도(다른 Worker와 공유) → 1개만 사용.
# 10분마다 깨어나 worker.js의 CRON_JOBS 표에 따라 실행 시각별 작업만 수행:
#   매시 :05 뉴스 · :35 뉴스+온체인 · 매시 :15/:25/:45/:55 Yahoo 시세 스냅샷
#   단 UTC 1/7/13/19시는 :15 H.4.1+liq · :25 T2+시세 절반 · :45 T3+예측모델 · :55 캘린더+시세 전체
crons = ["5,15,25,35,45,55 * * * *"]

[ai]
binding = "AI"
