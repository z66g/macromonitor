name = "macrolens-worker"
main = "worker.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding    = "MMF_KV"
id         = "66c313c710a04a4eb04775b80a44f313"
preview_id = "66c313c710a04a4eb04775b80a44f313"

[triggers]
# ★ worker.js의 CRON 상수와 반드시 동일하게 유지 (불일치 시 해당 작업이 실행되지 않음)
# cron-job.org가 :00/:30에 GH Actions(KV 쓰기)를 트리거하므로 Worker는 그 시각을 피함.
# 한 번의 실행당 서브요청 50건 한도 때문에 6시간 갱신을 4개 시각으로 분산.
crons = [
  "5,35 * * * *",        # 뉴스 RSS 수집
  "15 1,7,13,19 * * *",  # A: H.4.1 → liq + 국채 수익률
  "25 1,7,13,19 * * *",  # B: T2 실물경제
  "45 1,7,13,19 * * *",  # C: T3 글로벌 + 유동성 예측모델
  "55 1,7,13,19 * * *",  # D: 이벤트 캘린더
]

[ai]
binding = "AI"
