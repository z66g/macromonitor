name: Generate News Digest

on:
  # cron-job.org에서 repository_dispatch로 트리거 (매 3시간)
  repository_dispatch:
    types: [generate-news-digest]
  workflow_dispatch:
  # 발송(KST 06:00·21:00) 직전에 한 번 더 — 마지막 몇 시간 뉴스가 빠지지 않게
  schedule:
    - cron: '35 20,11 * * *'

# 마지막 텔레그램 발송 이후 뉴스에서 핵심 5~8건(제목 + 시장 의미 + 원문 링크) → KV news_digest_v1
# 발송은 Worker /news-digest-send (cron-job.org KST 06:00/21:00). 로직은 scripts/build_news_digest.py
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: news-digest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Generate digest via Gemini + Write KV
        env:
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID:       "66c313c710a04a4eb04775b80a44f313"
        run: |
          pip install requests -q
          python3 scripts/build_news_digest.py
