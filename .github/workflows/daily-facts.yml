name: Daily Facts

# 데일리 리포트 1단계 — 전일 미국 세션 팩트시트·이상 신호·과거 유사 국면 → data/daily/<세션일>/facts.json
# 미국 장 마감(16:00 ET) 뒤 실행. 리포트 에이전트(클라우드)는 이 파일만 읽는다(Worker 접근 불가).
# 트리거: GitHub schedule은 30분~3시간 늦거나 건너뛴다(2026-11-16 미실행) →
#   주 트리거 = cron-job.org repository_dispatch `daily-facts` (KST 06:20 화-토, 정시)
#   백업 = schedule 2개 + daily-report.yml 감시 단계의 재실행. 이미 draft/report 있는 세션은 스크립트가 덮지 않음.
on:
  repository_dispatch:
    types: [daily-facts]
  schedule:
    - cron: '20 21 * * 1-5'     # 백업 1: KST 06:20 화-토
    - cron: '50 22 * * 1-5'     # 백업 2: KST 07:50 (1이 빠졌을 때)
  workflow_dispatch:
    inputs:
      commit:
        description: '결과를 main에 커밋 (false면 아티팩트로만 — 시험 실행용)'
        type: boolean
        default: true

concurrency:
  group: daily-facts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build facts
        run: python3 scripts/build_daily_facts.py
      - name: Print facts (시험 실행 — 로그로 확인)
        if: github.event_name == 'workflow_dispatch' && !inputs.commit
        run: python3 -c "import json,glob;f=sorted(glob.glob('data/daily/*/facts.json'))[-1];print('FACTS_JSON '+json.dumps(json.load(open(f)),ensure_ascii=False,separators=(',',':')))"
      - name: Upload artifact (시험 실행)
        if: github.event_name == 'workflow_dispatch' && !inputs.commit
        uses: actions/upload-artifact@v4
        with:
          name: daily-facts
          path: data/daily/
      - name: Commit
        if: github.event_name != 'workflow_dispatch' || inputs.commit
        run: |
          bash scripts/commit_data.sh "chore: 데일리 팩트시트 [$(date -u '+%Y-%m-%d')]" data/daily/
