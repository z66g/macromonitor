name: Fetch Treasury Auctions

on:
  schedule:
    - cron: '20 */4 * * *'      # :00/:30 혼잡 시각 회피
  workflow_dispatch:

concurrency:
  group: fetch-auctions
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch upcoming / auctioned (TreasuryDirect)
        run: python3 scripts/fetch_auctions.py
      - name: Commit
        run: |
          bash scripts/commit_data.sh "chore: update auctions [$(date -u '+%Y-%m-%d %H:%M UTC')]" data/auctions.json
