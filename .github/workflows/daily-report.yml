name: Daily Report

# 리포트 에이전트가 data/daily/<세션>/draft.json을 push하면:
#   1) verify_daily_report.py — 형식·숫자 대조·이상 신호 반영·금지 표현 검사 → report.json 게시 (사이트 report.html이 읽음)
#   2) 실패 시 GitHub 이슈(daily-report)로 알림 — 구독자에게는 아무것도 나가지 않음
#   3) data/daily/config.json의 telegram이 true면 요약 + 전문 링크 발송
# GITHUB_TOKEN 커밋은 다른 워크플로를 트리거하지 않으므로 루프 없음.
on:
  push:
    branches: [main]
    paths: ['data/daily/*/draft.json']
  schedule:
    - cron: '20 23 * * 1-5'     # 백업: push 트리거 누락 대비 + 감시 (KST 08:20)
    - cron: '30 1 * * 2-6'      # 감시 2차 (KST 10:30) — schedule 지연·누락 대비
  workflow_dispatch:

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify + publish
        id: verify
        run: python3 scripts/verify_daily_report.py
      - name: Commit report
        if: always()
        run: |
          bash scripts/commit_data.sh "chore: 데일리 리포트 게시 [$(date -u '+%Y-%m-%d')]" data/daily/
      - name: Alert on failure (GitHub issue)
        if: failure() && steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create daily-report --color FBCA04 --description '데일리 리포트 검증 실패' --force
          f=$(ls -t data/daily/*/verify_errors.json | head -1)
          sess=$(basename "$(dirname "$f")")
          { echo "데일리 리포트 초안 검증 실패 — 사이트·텔레그램 미게시."; echo; echo '```'; python3 -c "import json,sys;[print('-',e) for e in json.load(open(sys.argv[1]))['errors']]" "$f"; echo '```'; echo; echo "다음 실행 때 에이전트가 고치거나, 지침(ops/routines/daily_report.md) 보강 필요."; } > body.md
          num=$(gh issue list --label daily-report --state open --json number -q '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body-file body.md; else gh issue create --label daily-report --title "데일리 리포트 검증 실패 ($sess)" --body-file body.md; fi
      - name: Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/send_daily_telegram.py
      - name: Commit sent flags
        if: success()
        run: |
          bash scripts/commit_data.sh "chore: 데일리 리포트 텔레그램 발송 표시" data/daily/

  # 감시: 오늘 세션의 팩트시트·초안이 없으면 조용히 빠진 것 → 팩트시트는 다시 실행, 이슈로 소유자에게 알림.
  # (draft push로 돈 실행에서는 생략 — 그땐 이미 진행 중이다)
  watchdog:
    needs: publish
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check today's session
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          st=$(python3 scripts/daily_common.py status --cutoff 23:15)
          echo "$st"
          sess=$(echo "$st" | python3 -c "import json,sys;print(json.load(sys.stdin)['expected'])")
          miss=$(echo "$st" | python3 -c "import json,sys;print(json.load(sys.stdin)['missing'] or '')")
          case "$miss" in
            facts)
              gh workflow run daily-facts.yml -f commit=true
              msg="팩트시트(data/daily/$sess/facts.json)가 없음 — daily-facts.yml 트리거가 돌지 않았다(cron-job.org \`daily-facts\` 작업 확인). 방금 자동으로 다시 실행했다. 커밋되면 claude.ai/code/routines에서 '데일리 리포트' 예약작업을 한 번 실행할 것." ;;
            draft)
              msg="팩트시트는 있는데 초안(draft.json)이 없음 — 리포트 에이전트가 안 돌았거나 팩트시트를 기다리다 끝났다. claude.ai/code/routines에서 '데일리 리포트' 예약작업을 한 번 실행할 것." ;;
            *) echo "정상 또는 검증 단계(별도 이슈) — 알림 없음"; exit 0 ;;
          esac
          gh label create daily-report --color FBCA04 --description '데일리 리포트 검증 실패·누락' --force
          body="세션 $sess: $msg"
          num=$(gh issue list --label daily-report --state open --json number -q '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body "$body"; else gh issue create --label daily-report --title "데일리 리포트 누락 ($sess)" --body "$body"; fi
