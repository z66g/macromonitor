name: Fetch Auction Results

# 결정적 수집만 담당 (LLM 없음). tail·요약은 클라우드 에이전트가 data/auction_ai.json에 쓰고
# auction-ai-merge.yml이 검증 후 반영·텔레그램 발송한다.
on:
  # cron-job.org에서 repository_dispatch로 트리거 (KST 06:00 화-토)
  repository_dispatch:
    types: [auction-results]
  workflow_dispatch:

concurrency:
  group: auction-results        # auction-ai-merge와 같은 파일을 쓰므로 직렬화
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch + Analyze (TreasuryDirect)
        run: python3 scripts/fetch_auction_results.py
      - name: Commit
        run: |
          bash scripts/commit_data.sh "chore: update auction results [$(date -u '+%Y-%m-%d %H:%M UTC')]" data/auction_results.json
