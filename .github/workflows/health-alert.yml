name: Health Alert

# 클라우드 헬스체크 에이전트가 진단(diagnosis)을 추가해 data/health.json을 push하면 이슈 갱신.
# (매일 점검 자체는 health-check.yml — GITHUB_TOKEN 커밋은 이 워크플로를 트리거하지 않으므로 거기서 직접 이슈 처리)
on:
  push:
    branches: [main]
    paths: [data/health.json]
  workflow_dispatch:

concurrency:
  group: health-issue
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Open / update / close health issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/health_issue.py
